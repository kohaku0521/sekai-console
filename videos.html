<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生成した動画を端末に保存</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--panel:#14171c;--panel2:#1a1e24;--line:#262b33;--text:#e6e9ee;--dim:#8b93a1;--accent:#3d79d5;--ok:#46b86a;--warn:#e0a63a;--err:#e5534b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:15px}
main{max-width:860px;margin:0 auto;padding:12px 12px 80px}
button,a.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font:inherit;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,a.btn:hover{border-color:var(--accent)}
button.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.45;cursor:default}
.hint{color:var(--dim);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:6px}
.msg{min-height:20px;font-size:13px;white-space:pre-wrap}.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
.asset{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
progress{width:100%;height:8px}
a{color:#79a8f0}
</style>
</head>
<body>
<header>
  <b>📥 生成した動画を端末に保存</b>
  <span class="hint" id="ver">版 11/05 端末に保存</span>
  <span style="flex:1"></span>
  <button id="b-reload">読み込み直す</button>
  <a href="images.html" style="font-size:12px">画像入れ替えコンソール</a>
</header>
<main>
  <div class="card hint">
    生成が終わった動画（長尺・切り抜きショート・微調整・編集したもの）が、新しい順に<b>8本ぶん</b>ここに並びます。<b>「端末に保存」</b>を押すと、スマホ・PCに mp4 が保存されます。保存した mp4 は、<b>CapCut</b>などで編集できます。
    <b>「共有（CapCutなどへ）」</b>は、スマホの共有のメニューが開くので、CapCut を選べば、そのまま読み込めます（対応していない端末・ブラウザでは、「端末に保存」を使ってください）。
    動画が大きい（長尺は数百MB）ときは、保存に時間がかかります。通信は、Wi-Fi がおすすめです。
  </div>
  <div class="msg" id="msg"></div>
  <div id="list"></div>
</main>

<script>
const gh = {owner: "kohaku0521", repo: "kaitai-check", branch: "main", token: ""};
try { Object.assign(gh, JSON.parse(localStorage.getItem("tas.gh") || "{}")); } catch {}
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const msg = (t, cls = "") => { const e = $("#msg"); e.textContent = t || ""; e.className = "msg " + cls; };
const ghReady = () => !!(gh.token && gh.owner && gh.repo);
const AUTH = {"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"};
async function api(path){
  const r = await fetch("https://api.github.com" + path, {headers: {...AUTH, "Authorization": "Bearer " + gh.token}}).catch(() => { throw new Error("GitHubに接続できません（通信状態を確認してください）"); });
  const j = await r.json().catch(() => null);
  if(!r.ok) throw new Error(`GitHub ${r.status}: ${(j && j.message) || r.statusText}`);
  return j;
}
const mb = n => (n / 1048576).toFixed(n >= 10485760 ? 0 : 1) + "MB";
const when = s => { const d = new Date(s); return isNaN(d) ? "" : d.toLocaleString("ja-JP", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"}); };

let RELS = [];
async function load(){
  if(!ghReady()){ msg("先に、画像入れ替えコンソールの「⚙ 接続設定」で、GitHubにつないでください（同じブラウザなら、設定が共有されます）", "err"); return; }
  msg("読み込んでいます…");
  try{
    const rels = await api(`/repos/${gh.owner}/${gh.repo}/releases?per_page=40`);
    RELS = rels.filter(r => String(r.tag_name).startsWith("video-")).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    render(); msg(RELS.length ? "" : "保存された動画は、まだありません。生成（④）が終わると、ここに並びます");
  }catch(e){ msg(e.message, "err"); }
}
function render(){
  $("#list").innerHTML = RELS.map((r, ri) => `<div class="card"><h3>${esc((r.name || r.tag_name).replace(/^完成: /, ""))}</h3>
    <div class="hint">${esc(when(r.created_at))}　${esc(r.tag_name)}</div>
    ${(r.assets || []).map((a, ai) => `<div class="asset"><div>${esc(a.name)} <span class="hint">（${mb(a.size)}）</span></div>
      <div class="row" style="margin-top:4px">${/\.(mp4|mov)$/i.test(a.name) ? `<button class="primary" data-save="${ri}:${ai}">📥 端末に保存</button><button data-share="${ri}:${ai}">共有（CapCutなどへ）</button>` : `<button data-save="${ri}:${ai}">📥 端末に保存</button>`}
        <a class="btn" href="${esc(a.browser_download_url)}" target="_blank" rel="noopener" title="GitHubにログインしたブラウザなら、直接ダウンロードできます">リンクで開く</a></div>
      <div data-prog="${ri}:${ai}"></div></div>`).join("") || `<div class="hint">ファイルがありません（保存の途中かもしれません。少し待って、「読み込み直す」を押してください）</div>`}
    <div class="row" style="margin-top:8px"><a href="${esc(r.html_url)}" target="_blank" rel="noopener" class="hint">リリースのページを開く</a></div></div>`).join("");
  document.querySelectorAll("[data-save]").forEach(b => b.onclick = () => fetchAsset(b.dataset.save, "save"));
  document.querySelectorAll("[data-share]").forEach(b => b.onclick = () => fetchAsset(b.dataset.share, "share"));
}
// アプリの中で取り出して（API→署名つきの保存先）、端末に保存する／共有メニューへ渡す。大きい動画は、メモリを使う
async function fetchAsset(key, mode){
  const [ri, ai] = key.split(":").map(Number), a = RELS[ri].assets[ai], box = document.querySelector(`[data-prog="${key}"]`);
  box.innerHTML = `<progress max="1" value="0"></progress><div class="hint">取り出しています…</div>`;
  const bar = box.querySelector("progress"), txt = box.querySelector(".hint");
  try{
    const r = await fetch(a.url, {headers: {"Accept": "application/octet-stream", "Authorization": "Bearer " + gh.token, "X-GitHub-Api-Version": "2022-11-28"}});
    if(!r.ok) throw new Error(`取り出せませんでした（${r.status}）`);
    const total = a.size, rd = r.body && r.body.getReader ? r.body.getReader() : null, chunks = []; let got = 0;
    if(rd){ for(;;){ const {done, value} = await rd.read(); if(done) break; chunks.push(value); got += value.length; bar.value = Math.min(got / total, 1); txt.textContent = `取り出しています… ${mb(got)} / ${mb(total)}`; } }
    else { const buf = new Uint8Array(await r.arrayBuffer()); chunks.push(buf); got = buf.length; }
    const blob = new Blob(chunks, {type: /\.mp4$/i.test(a.name) ? "video/mp4" : a.content_type || "application/octet-stream"});
    if(mode === "share"){
      const f = new File([blob], a.name, {type: blob.type});
      if(navigator.canShare && navigator.canShare({files: [f]})){ await navigator.share({files: [f], title: a.name}); box.innerHTML = `<div class="hint" style="color:var(--ok)">共有のメニューを開きました</div>`; return; }
      txt.textContent = "この端末・ブラウザは、共有に対応していません。「端末に保存」を使ってください";
      return;
    }
    const url = URL.createObjectURL(blob), el = document.createElement("a"); el.href = url; el.download = a.name; document.body.appendChild(el); el.click(); el.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    box.innerHTML = `<div class="hint" style="color:var(--ok)">保存しました（${mb(blob.size)}）。端末の「ダウンロード」を確認してください</div>`;
  }catch(e){
    if(e && e.name === "AbortError"){ box.innerHTML = ""; return; }
    box.innerHTML = `<div class="hint" style="color:var(--err)">${esc(e.message || e)}　（「リンクで開く」を使ってください）</div>`;
  }
}
$("#b-reload").onclick = load;
load();
</script>
</body>
</html>
